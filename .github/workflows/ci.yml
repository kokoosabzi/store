name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q backend tests migrations
      - name: Run backend tests
        run: python -m pytest -q --ignore=tests/test_koko_ui_browser.py --ignore=tests/test_koko_dark_theme_browser.py

  frontend:
    name: Frontend build and browser UI tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install browser test dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m playwright install chromium
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install
      - name: Validate Koko UI JavaScript syntax
        working-directory: frontend
        run: |
          node --check src/koko-theme-engine.js
          node --check src/koko-workspace-tabs.js
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Run browser UI tests
        run: python -m pytest -q tests/test_koko_ui_browser.py tests/test_koko_dark_theme_browser.py

  windows-smoke:
    name: Windows local install, commerce, backup and recovery
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      LCC_NO_PAUSE: "1"
      LCC_NO_BROWSER: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Verify setup refuses to ignore an existing repository database
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "data" | Out-Null
          New-Item -ItemType File -Force -Path "data/local_commerce.db" | Out-Null
          cmd /c "call setup.bat && echo unexpected-success > setup-guard-result.txt || echo expected-refusal > setup-guard-result.txt"
          if ((Get-Content "setup-guard-result.txt" -Raw).Trim() -ne "expected-refusal") {
            Remove-Item "data/local_commerce.db" -Force
            throw "setup.bat accepted an existing repository-local database without an explicit data-directory choice."
          }
          Remove-Item "setup-guard-result.txt" -Force
          Remove-Item "data/local_commerce.db" -Force
      - name: Install Python dependencies, build frontend and migrate SQLite
        shell: cmd
        run: setup.bat
      - name: Start the single-process Windows application
        shell: cmd
        run: start.bat
      - name: Verify UI, manager PIN, purchase, sale and reporting
        shell: pwsh
        run: |
          $health = Invoke-RestMethod -Uri "http://127.0.0.1:8000/api/health"
          if ($health.status -ne "ok") { throw "Health endpoint failed." }
          $homePage = Invoke-WebRequest -Uri "http://127.0.0.1:8000/" -UseBasicParsing
          if ($homePage.StatusCode -ne 200 -or $homePage.Content -notmatch 'id="app"') { throw "Production Vue UI was not served by FastAPI." }
          $pin = Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:8000/api/security/setup-pin" -ContentType "application/json" -Body (@{pin="1234"} | ConvertTo-Json)
          $account = Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:8000/api/accounts?name=Windows%20Cash"
          $supplier = Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:8000/api/suppliers" -ContentType "application/json" -Body (@{name="Windows Supplier"} | ConvertTo-Json)
          $product = Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:8000/api/products" -ContentType "application/json" -Body (@{name="Windows Smoke Product";current_purchase_price="100";retail_price="150";min_stock="1"} | ConvertTo-Json)
          $purchaseBody = @{supplier_id=$supplier.id;items=@(@{product_id=$product.id;quantity="5";unit_price="100"})} | ConvertTo-Json -Depth 6
          $purchase = Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:8000/api/purchases/draft" -ContentType "application/json" -Body $purchaseBody
          Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:8000/api/purchases/$($purchase.id)/finalize?account_id=$($account.id)" | Out-Null
          $saleBody = @{items=@(@{product_id=$product.id;quantity="2";unit_price="150"});paid_amount="300"} | ConvertTo-Json -Depth 6
          $saleDraftResponse = Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:8000/api/sales/draft" -ContentType "application/json" -Body $saleBody
          Write-Host ("Sale draft response: " + ($saleDraftResponse | ConvertTo-Json -Compress))
          $saleDrafts = Invoke-RestMethod -Uri "http://127.0.0.1:8000/api/sales"
          if (-not $saleDrafts) { throw "Sale draft was not persisted." }
          $saleId = [int]($saleDrafts | Select-Object -Last 1).id
          if ($saleId -lt 1) { throw "Sale draft has no valid ID." }
          Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:8000/api/sales/$saleId/finalize?account_id=$($account.id)" | Out-Null
          $inventory = Invoke-RestMethod -Uri "http://127.0.0.1:8000/api/inventory"
          $stock = $inventory | Where-Object { $_.id -eq $product.id }
          if ($stock.current_stock -ne "3.000") { throw "Purchase/sale inventory did not reconcile." }
          $profit = Invoke-RestMethod -Uri "http://127.0.0.1:8000/api/reports/profit-loss"
          if ($profit.revenue -ne "300.00" -or $profit.cogs -ne "200.00000") { throw "Historical COGS or profit report did not reconcile." }
          $backup = Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:8000/api/backups"
          Set-Content -Path (Join-Path $env:RUNNER_TEMP "lcc-backup-name.txt") -Value ([IO.Path]::GetFileName($backup.path))
          Set-Content -Path (Join-Path $env:RUNNER_TEMP "lcc-product-id.txt") -Value $product.id
          Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:8000/api/products" -ContentType "application/json" -Body (@{name="Created After Backup"} | ConvertTo-Json) | Out-Null
          if ((Invoke-RestMethod -Uri "http://127.0.0.1:8000/api/products").Count -ne 2) { throw "Post-backup test product was not created." }
          $restoreBody = @{backup_name=(Get-Content (Join-Path $env:RUNNER_TEMP "lcc-backup-name.txt") -Raw).Trim();pin="1234"} | ConvertTo-Json
          $restored = Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:8000/api/restore" -ContentType "application/json" -Body $restoreBody
          if (-not (Test-Path $restored.pre_restore_backup)) { throw "Pre-restore safety backup was not created." }
          $products = Invoke-RestMethod -Uri "http://127.0.0.1:8000/api/products"
          if ($products.Count -ne 1 -or $products[0].id -ne $product.id) { throw "Restore did not return the database to the selected snapshot." }
      - name: Stop the Windows application
        shell: cmd
        run: stop.bat
      - name: Restart and verify data persistence
        shell: cmd
        run: start.bat
      - name: Verify health, product and accounting data after restart
        shell: pwsh
        run: |
          $health = Invoke-RestMethod -Uri "http://127.0.0.1:8000/api/health"
          if ($health.status -ne "ok") { throw "Health check failed after restart." }
          $productId = [int](Get-Content (Join-Path $env:RUNNER_TEMP "lcc-product-id.txt") -Raw)
          $products = Invoke-RestMethod -Uri "http://127.0.0.1:8000/api/products"
          if ($products.Count -ne 1 -or $products[0].id -ne $productId) { throw "Restored product data did not survive restart." }
          $profit = Invoke-RestMethod -Uri "http://127.0.0.1:8000/api/reports/profit-loss"
          if ($profit.revenue -ne "300.00" -or $profit.cogs -ne "200.00000") { throw "Financial history did not survive restore and restart." }
      - name: Stop after restart
        shell: cmd
        run: stop.bat
      - name: Verify server process and PID cleanup
        shell: pwsh
        run: |
          $pidFile = Join-Path $env:LOCALAPPDATA "LocalCommerceCore\run\server.pid"
          if (Test-Path $pidFile) { throw "Local Commerce Core PID file was not removed." }
          $remaining = Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -match "uvicorn backend.app.main:app" }
          if ($remaining) { throw "Local Commerce Core server process is still running." }
